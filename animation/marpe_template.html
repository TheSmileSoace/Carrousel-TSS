<meta charset="utf-8">
<title>Expansion maxillaire (MARPE) — soutien des tissus mous</title>
<style>
  html,body{margin:0;padding:0;background:#2A2723;overflow:hidden;}
  #stage{position:fixed;inset:0;}
  svg{display:block;width:100vw;height:100vh;}
  text{font-family:"Poppins","Inter","Segoe UI",system-ui,sans-serif;}
</style>
<div id="stage"></div>
<script>
/* =====================================================================
   The Smile Space — Expansion maxillaire (MARPE) et soutien des tissus mous
   Message unique : l'os bouge d'abord, les tissus suivent.
   Rendu déterministe : window.__seek(tSec). Config en tête.
   ===================================================================== */
const CONFIG = {
  totalSec: 21, fps: 30,
  stages: [
    { key:'depart',    t0:0.0,  t1:5.5,  label:'MAXILLAIRE ÉTROIT' },
    { key:'expansion', t0:5.5,  t1:12.5, label:'EXPANSION MARPE' },
    { key:'resultat',  t0:12.5, t1:21.0, label:'BASE ÉLARGIE' },
  ],
  crossfadeSec: 0.6,
  bottomSafe: 300,            // marge basse vide (UI Instagram)
  // amplitude / rendu
  expandAmp: 30,             // décalage transversal max à la base (px monde)
  tissueOpacity: 0.24,       // opacité du calque tissus mous
  tissueLagSec: 1.0,         // les tissus suivent l'os avec ce retard
  colors: {
    bg:'#2A2723',
    bone:'#E9DCC0', boneEdge:'#CBB68A', boneShade:'rgba(120,100,66,.18)',
    maxilla:'#C3A46E', maxillaEdge:'#A9884F', suture:'#8A6B3A',
    tooth:'#F5EFE2', cavity:'#211E1A',
    tissue:'#E7C6A2', crease:'rgba(90,60,35,.5)',
    device:'#B9BEC4', deviceEdge:'#8A9098',
    ink:'#FFFFFF', muted:'rgba(255,255,255,.6)', gold:'#C3A46E',
  },
};
const LOGO = "__LOGO_DATAURI__";
const SVGNS="http://www.w3.org/2000/svg", C=CONFIG.colors;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u, smooth=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
function key(pairs,t){ if(t<=pairs[0][0])return pairs[0][1];
  for(let i=0;i<pairs.length-1;i++){const[a,va]=pairs[i],[b,vb]=pairs[i+1]; if(t<=b)return lerp(va,vb,smooth((t-a)/(b-a)));}
  return pairs[pairs.length-1][1]; }

/* ---------- timeline ---------- */
const P = {
  expand: t=>key([[0,0],[5.5,0],[12.5,1],[21,1]],t),                 // ouverture transversale
  suture: t=>key([[0,0],[5.5,0],[12.0,1],[21,1]],t),
  device: t=>key([[0,0],[5.3,0],[6.2,1],[12.5,1],[13.6,0],[21,0]],t),// dispositif visible pendant l'expansion
  ghost:  t=>key([[0,0],[14.5,0],[15.4,1],[18.2,1],[19.0,0],[21,0]],t), // comparatif avant/après
};
// tissus : suivent l'os avec retard (l'os bouge d'abord)
P.tissue = t=>P.expand(t - CONFIG.tissueLagSec);

/* ---------- DOM ---------- */
let W,H,root,els={};
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function build(){
  document.getElementById('stage').innerHTML='';
  W=window.innerWidth; H=window.innerHeight;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid slice'},document.getElementById('stage')); root=svg;
  el('rect',{x:0,y:0,width:W,height:H,fill:C.bg},svg);
  const BARE=/bare=1/.test(location.search); els.bare=BARE;
  // masque : le calque tissus ne déborde pas hors du crâne
  els.defs=el('defs',{},svg);
  els.clip=el('clipPath',{id:'skullclip'},els.defs);
  els.clipPath=el('path',{},els.clip);

  // boîte crâne : centrée, au-dessus de la marge basse vide
  const safe = BARE? H*0.02 : CONFIG.bottomSafe;
  const topLbl = BARE? H*0.03 : H*0.11;
  const areaTop=topLbl, areaBot=H-safe- (BARE?H*0.02:H*0.12);
  const availH=areaBot-areaTop;
  const SH=Math.min(availH, W*1.28), SW=SH*0.78;
  const sx=W/2, sy=areaTop+(availH-SH)/2;
  els.sk={sx,sy,SW,SH};

  els.scene=el('g',{},svg);                 // tout ce qui peut être masqué au fondu
  els.bone=el('g',{},els.scene);
  els.maxL=el('path',{fill:C.maxilla,stroke:C.maxillaEdge,'stroke-width':3},els.scene);
  els.maxR=el('path',{fill:C.maxilla,stroke:C.maxillaEdge,'stroke-width':3},els.scene);
  els.sutureG=el('path',{fill:C.cavity,opacity:0.9},els.scene);
  els.teeth=el('g',{},els.scene);
  els.device=el('g',{opacity:0},els.scene);
  els.tissue=el('g',{opacity:CONFIG.tissueOpacity,'clip-path':'url(#skullclip)'},els.scene);   // calque tissus mous (au-dessus, semi-transparent, borné au crâne)
  els.creases=el('g',{'clip-path':'url(#skullclip)'},els.scene);   // sillons para-nasaux (plus visibles)
  els.ghost=el('path',{fill:'none',stroke:'#fff','stroke-width':3,'stroke-dasharray':'6 10',opacity:0},els.scene);

  // label d'étape (haut) + sous-titre
  if(!BARE){
    els.lbl=el('text',{x:W/2,y:topLbl*0.62,'text-anchor':'middle','font-weight':700,'font-size':Math.round(W*0.05),fill:C.ink,'letter-spacing':2},svg);
    els.sub=el('text',{x:W/2,y:topLbl*0.62+Math.round(W*0.052),'text-anchor':'middle','font-weight':500,'font-size':Math.round(W*0.028),fill:C.muted},svg);
    // logo + handle empilés au-dessus de la marge basse vide
    const lw=W*0.22, lh=lw*0.545, ly=H-safe-lh-Math.round(W*0.05);
    if(LOGO && LOGO.indexOf('__')!==0){ el('image',{href:LOGO,x:(W-lw)/2,y:ly,width:lw,height:lh,opacity:0.9},svg); }
    else el('text',{x:W/2,y:ly+lh*0.7,'text-anchor':'middle','font-weight':700,'font-size':Math.round(W*0.032),fill:'#fff'},svg).textContent="The Smile Space";
    el('text',{x:W/2,y:ly+lh+Math.round(W*0.03),'text-anchor':'middle','font-weight':500,'font-size':Math.round(W*0.022),fill:C.muted},svg).textContent="@thesmilespace";
  }
  els.fade=el('rect',{x:0,y:0,width:W,height:H,fill:C.bg,opacity:0},svg);
  buildBone();
}

/* niveaux anatomiques (fractions de la boîte crâne) */
function Y(f){const s=els.sk; return s.sy+f*s.SH;}
function Xh(f){const s=els.sk; return f*s.SW;} // demi-largeur

function buildBone(){
  els.bone.innerHTML='';
  const s=els.sk, cx=s.sx;
  // silhouette crâne (voûte + tempes + zygomas + effilement mâchoire)
  const P0=(x,y)=>x+' '+y;
  let d='M '+P0(cx, Y(0.015));
  d+=' C '+P0(cx+Xh(0.34),Y(0.00))+' '+P0(cx+Xh(0.49),Y(0.12))+' '+P0(cx+Xh(0.49),Y(0.26));  // voûte -> tempe
  d+=' C '+P0(cx+Xh(0.49),Y(0.32))+' '+P0(cx+Xh(0.41),Y(0.35))+' '+P0(cx+Xh(0.43),Y(0.42));  // légère dépression temporale
  d+=' C '+P0(cx+Xh(0.51),Y(0.45))+' '+P0(cx+Xh(0.50),Y(0.49))+' '+P0(cx+Xh(0.44),Y(0.55));  // pommette (zygoma, FIXE) : bosse puis rentre
  d+=' C '+P0(cx+Xh(0.37),Y(0.66))+' '+P0(cx+Xh(0.24),Y(0.80))+' '+P0(cx+Xh(0.10),Y(0.87));  // joue -> mâchoire
  d+=' Q '+P0(cx+Xh(0.05),Y(0.895))+' '+P0(cx, Y(0.895));                                     // menton arrondi
  d+=' Q '+P0(cx-Xh(0.05),Y(0.895))+' '+P0(cx-Xh(0.10),Y(0.87));
  d+=' C '+P0(cx-Xh(0.24),Y(0.80))+' '+P0(cx-Xh(0.37),Y(0.66))+' '+P0(cx-Xh(0.44),Y(0.55));
  d+=' C '+P0(cx-Xh(0.50),Y(0.49))+' '+P0(cx-Xh(0.51),Y(0.45))+' '+P0(cx-Xh(0.43),Y(0.42));
  d+=' C '+P0(cx-Xh(0.41),Y(0.35))+' '+P0(cx-Xh(0.49),Y(0.32))+' '+P0(cx-Xh(0.49),Y(0.26));
  d+=' C '+P0(cx-Xh(0.49),Y(0.12))+' '+P0(cx-Xh(0.34),Y(0.00))+' '+P0(cx, Y(0.015))+' Z';
  el('path',{d,fill:C.bone,stroke:C.boneEdge,'stroke-width':3},els.bone);
  if(els.clipPath) els.clipPath.setAttribute('d',d);   // synchronise le masque tissus
  // ombre sous-orbitaire / tempes (subtil)
  el('path',{d,fill:'none',stroke:C.boneShade,'stroke-width':10,opacity:0.25},els.bone);

  // orbites (cavités)
  for(const sgn of [-1,1]){
    el('path',{d:orbitPath(cx+sgn*Xh(0.22),Y(0.34),Xh(0.17),Y(0.44)-Y(0.30)),fill:C.cavity},els.bone);
  }
  // ouverture nasale (poire)
  const nx=cx, nyT=Y(0.40), nyB=Y(0.55), nw=Xh(0.085);
  let np='M '+nx+' '+nyT;
  np+=' C '+(nx+nw*0.7)+' '+(nyT+8)+' '+(nx+nw)+' '+(nyB-30)+' '+(nx+nw*0.8)+' '+(nyB-6);
  np+=' Q '+nx+' '+(nyB+10)+' '+(nx-nw*0.8)+' '+(nyB-6);
  np+=' C '+(nx-nw)+' '+(nyB-30)+' '+(nx-nw*0.7)+' '+(nyT+8)+' '+nx+' '+nyT+' Z';
  el('path',{d:np,fill:C.cavity},els.bone);
}
function orbitPath(cx,cy,rx,ry){ // orbite arrondie (super-ellipse douce)
  return `M ${cx-rx} ${cy} Q ${cx-rx} ${cy-ry} ${cx} ${cy-ry} Q ${cx+rx} ${cy-ry} ${cx+rx} ${cy} Q ${cx+rx} ${cy+ry} ${cx} ${cy+ry} Q ${cx-rx} ${cy+ry} ${cx-rx} ${cy} Z`;
}

/* ---------- maxillaire : deux hémi-maxillaires qui s'écartent ---------- */
// pivot haut (sous-orbitaire) -> l'expansion s'atténue en remontant
function maxShift(y, expand){
  const yP=Y(0.50), yB=Y(0.72);
  const f=clamp((y-yP)/(yB-yP),0,1);
  return expand*CONFIG.expandAmp*f;         // px, latéral
}
function maxHalfPath(side, expand){ // side=-1 gauche, +1 droite
  const s=els.sk, cx=s.sx;
  // sommets (x relatif au centre, y)
  const V=[
    [0.010, 0.520],[0.150, 0.520],[0.300, 0.560],[0.320, 0.630],
    [0.270, 0.700],[0.230, 0.720],[0.012, 0.720],[0.010, 0.630],
  ];
  let d='';
  V.forEach((p,i)=>{
    const y=Y(p[1]); const x=cx+side*(Xh(p[0])) + side*maxShift(y,expand);
    d+=(i?' L ':'M ')+x+' '+y;
  });
  return d+' Z';
}
function suturePath(expand){
  const s=els.sk, cx=s.sx;
  const yT=Y(0.520), yB=Y(0.720);
  const gT=maxShift(yT,expand), gB=maxShift(yB,expand);
  return `M ${cx-gT} ${yT} L ${cx-gB} ${yB} L ${cx+gB} ${yB} L ${cx+gT} ${yT} Z`;
}

/* ---------- dents ---------- */
function buildTeeth(expand){
  els.teeth.innerHTML='';
  const s=els.sk, cx=s.sx, y=Y(0.700), tw=Xh(0.045), th=Y(0.735)-Y(0.700);
  for(const side of [-1,1]){
    for(let i=0;i<5;i++){
      const baseX=cx+side*(Xh(0.03)+i*Xh(0.05));
      const x=baseX+side*maxShift(y+th/2,expand);
      el('rect',{x:x-tw/2,y:y,width:tw,height:th,rx:5,fill:C.tooth,stroke:C.boneEdge,'stroke-width':1.5},els.teeth);
    }
  }
}

/* ---------- dispositif MARPE ---------- */
function buildDevice(expand){
  els.device.innerHTML='';
  const s=els.sk, cx=s.sx, y=Y(0.66);
  // vérin central
  el('rect',{x:cx-46,y:y-16,width:92,height:32,rx:6,fill:C.device,stroke:C.deviceEdge,'stroke-width':2},els.device);
  for(let i=-2;i<=2;i++) el('line',{x1:cx+i*14,y1:y-14,x2:cx+i*14,y2:y+14,stroke:C.deviceEdge,'stroke-width':2,opacity:0.7},els.device);
  el('circle',{cx:cx,cy:y,r:6,fill:C.deviceEdge},els.device);
  // bras + mini-vis (4 points d'ancrage au palais)
  for(const side of [-1,1]){
    for(const dy of [-1,1]){
      const ax=cx+side*(46+42), ay=y+dy*22;
      el('line',{x1:cx+side*46,y1:y+dy*6,x2:ax,y2:ay,stroke:C.device,'stroke-width':6,'stroke-linecap':'round'},els.device);
      el('circle',{cx:ax,cy:ay,r:7,fill:C.device,stroke:C.deviceEdge,'stroke-width':2},els.device);
      el('circle',{cx:ax,cy:ay,r:2.5,fill:C.deviceEdge},els.device);
    }
  }
}

/* ---------- calque tissus mous ---------- */
function buildTissue(tissue){
  els.tissue.innerHTML='';
  const cx=els.sk.sx;
  const P0=(x,y)=>x+' '+y;
  const fill=tissue;                 // 0 = départ (creusé) .. 1 = résultat (retendu)
  const push=fill*CONFIG.expandAmp*0.55;   // le tissu se comble en suivant l'os (discret)
  // masque joue semi-transparent (tiers moyen) : bord externe ~fixe (malaire),
  // bord médial para-nasal qui se comble ; on voit l'os dessous (opacité basse)
  for(const side of [-1,1]){
    const yT=Y(0.44), yM=Y(0.57), yB=Y(0.71);
    const paraT=cx+side*(Xh(0.12)+push*0.4);
    const paraM=cx+side*(Xh(0.15)+push);         // creux para-nasal qui se comble
    const outer=cx+side*Xh(0.45);                // malaire (fixe)
    let d='M '+P0(paraT,yT);
    d+=' Q '+P0(paraM,yM)+' '+P0(cx+side*(Xh(0.20)+push*0.6),yB);
    d+=' L '+P0(outer,yB)+' Q '+P0(cx+side*Xh(0.47),yM)+' '+P0(outer,yT)+' Z';
    el('path',{d,fill:C.tissue,opacity:0.30},els.tissue);
  }
  // plis para-nasaux (sillons) : nets au départ, s'estompent quand le tissu se retend
  els.creases.innerHTML='';
  const ca=(1-fill);
  for(const side of [-1,1]){
    el('path',{d:`M ${cx+side*Xh(0.13)} ${Y(0.515)} Q ${cx+side*Xh(0.165)} ${Y(0.60)} ${cx+side*Xh(0.215)} ${Y(0.69)}`,
      fill:'none',stroke:C.crease,'stroke-width':7,'stroke-linecap':'round',opacity:(0.55*ca).toFixed(3)},els.creases);
  }
}

/* ---------- rendu ---------- */
function render(tSec){
  if(!root) build();
  const t=((tSec%CONFIG.totalSec)+CONFIG.totalSec)%CONFIG.totalSec;
  const expand=P.expand(t), tissue=P.tissue(t), dev=P.device(t), gh=P.ghost(t);

  els.maxL.setAttribute('d',maxHalfPath(-1,expand));
  els.maxR.setAttribute('d',maxHalfPath(1,expand));
  els.sutureG.setAttribute('d',suturePath(expand));
  buildTeeth(expand);
  buildDevice(expand); els.device.setAttribute('opacity',dev.toFixed(3));
  buildTissue(tissue);

  // comparatif « avant » : contour étroit fantôme superposé au résultat
  els.ghost.setAttribute('d', maxHalfPath(-1,0)+' '+maxHalfPath(1,0));
  els.ghost.setAttribute('opacity',(0.5*gh).toFixed(3));

  if(!els.bare){
    let st=CONFIG.stages[0]; for(const s of CONFIG.stages) if(t>=s.t0) st=s;
    els.lbl.textContent=st.label;
    els.sub.textContent = (t>=CONFIG.stages[1].t0)? "L’os bouge d’abord — les tissus suivent." : "";
  }
  // fondu de boucle : la dernière image saturée = la première (toutes deux sur le fond)
  const cf=CONFIG.crossfadeSec, dt=1/CONFIG.fps, lastT=CONFIG.totalSec-dt; let fo=0;
  if(t>=lastT) fo=1;
  else if(t>CONFIG.totalSec-cf) fo=smooth((t-(CONFIG.totalSec-cf))/(cf-dt));
  else if(t<cf) fo=1-smooth(t/cf);
  els.fade.setAttribute('opacity',fo.toFixed(3));
}

/* ---------- API ---------- */
window.__meta={total:CONFIG.totalSec,fps:CONFIG.fps};
window.__seek=function(t){ if(!root)build(); render(t); };
let raf=null,t0=null;
function loop(ts){ if(t0===null)t0=ts; render((ts-t0)/1000); raf=requestAnimationFrame(loop); }
window.addEventListener('resize',build);
const m=location.search.match(/still=([\d.]+)/);
if(m){ window.__capture=true; build(); render(parseFloat(m[1])); }
else { build(); if(!window.__capture){ raf=requestAnimationFrame(loop);} else render(0); }
</script>
